app = "prospectpilot-pro-ariane"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "python manage.py migrate --noinput && python manage.py initialize_app && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180"
  worker = "celery -A config worker -l info --concurrency=2"
  beat = "celery -A config beat -l info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
